<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Full Display DJ Console</title>
  <!-- Font Awesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: radial-gradient(circle at center, #131622 0%, #08090e 100%);
      color: #e1e6f0; font-family: 'Segoe UI', system-ui, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* System Power Start Screen */
    #powerScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #08090e; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10000;
      transition: opacity 0.5s ease;
    }
    .power-btn-main {
      width: 90px; height: 90px; border-radius: 50%;
      background: #151824; border: 2px solid #00ffcc;
      color: #00ffcc; font-size: 2.2rem; cursor: pointer;
      box-shadow: 0 0 25px rgba(0,255,204,0.4);
      display: flex; justify-content: center; align-items: center;
      transition: all 0.3s ease;
    }
    .power-btn-main:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(0,255,204,0.8);
      background: #00ffcc; color: #08090e;
    }
    .power-text-hint { margin-top: 15px; font-size: 0.85rem; color: #8f9bb3; letter-spacing: 1px; }

    /* Intro & Power Off Title Animation Overlay */
    #introAnimationScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #08090e; display: none; justify-content: center;
      align-items: center; flex-direction: column; z-index: 9999;
    }
    .animated-title {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      color: #00ffcc;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
      opacity: 0;
      transform: scale(0.5);
      text-align: center;
    }
    .animated-subtitle {
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      color: #ff007f;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff007f;
      margin-top: 10px;
      opacity: 0;
      transform: scale(0.5);
      text-align: center;
    }
    
    @keyframes titlePowerOn {
      0% { opacity: 0; transform: scale(0.3); filter: blur(10px); }
      30% { opacity: 1; transform: scale(1.1); filter: blur(0px); }
      70% { opacity: 1; transform: scale(1); filter: blur(0px); }
      100% { opacity: 0; transform: scale(1.2); filter: blur(5px); }
    }
    @keyframes titlePowerOff {
      0% { opacity: 1; transform: scale(1); filter: blur(0px); }
      50% { opacity: 0.8; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(0.1); filter: blur(15px); }
    }

    .play-power-on { animation: titlePowerOn 3s forwards ease-in-out; }
    .play-power-off { animation: titlePowerOff 3s forwards ease-in-out; }

    /* Lock Screen Modal */
    #lockScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(8, 9, 14, 0.96); backdrop-filter: blur(15px);
      display: none; justify-content: center; align-items: center;
      z-index: 9998; flex-direction: column; gap: 15px;
    }
    .lock-box {
      background: #151824; border: 1px solid #00ffcc; padding: 25px;
      border-radius: 12px; text-align: center; box-shadow: 0 0 20px rgba(0,255,204,0.2);
      max-width: 320px; width: 90%;
      transition: all 0.3s ease;
    }
    .lock-box h2 { color: #00ffcc; font-size: 1.2rem; margin-bottom: 12px; }
    .lock-box input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #282d42;
      background: #0a0c13; color: #fff; text-align: center; font-size: 1.1rem;
      outline: none; margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    .lock-box input:disabled {
      background: #1a1f2e; color: #00ffcc; border-color: #00ffcc; cursor: not-allowed; opacity: 0.8;
    }
    .lock-box button {
      width: 100%; padding: 10px; border-radius: 6px; border: none;
      background: #00ffcc; color: #08090e; font-weight: bold; cursor: pointer;
      font-size: 0.9rem; transition: all 0.3s ease;
    }
    .lock-box button:disabled { background: #282d42; color: #8f9bb3; cursor: not-allowed; }
    #lockError { color: #ff007f; font-size: 0.75rem; min-height: 15px; margin-top: 8px; }

    @keyframes verifyingPulse {
      0% { box-shadow: 0 0 10px rgba(0,255,204,0.3); border-color: #00ffcc; }
      50% { box-shadow: 0 0 30px rgba(0,255,204,0.9); border-color: #00ffcc; transform: scale(1.02); }
      100% { box-shadow: 0 0 10px rgba(0,255,204,0.3); border-color: #00ffcc; }
    }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .verifying-anim { animation: verifyingPulse 1s infinite ease-in-out; }
    .shake-anim { animation: shakeError 0.4s ease-in-out; border-color: #ff007f !important; }

    /* App Layout */
    .app-container {
      width: 100%; height: 100%; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
      position: relative;
    }
    
    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 6px 8px; 
      flex-shrink: 0; 
      flex-wrap: wrap; 
      gap: 8px; 
      margin-top: 5px;
    }

    .brand-header-box { display: flex; align-items: center; gap: 12px; }
    .btn-power-off-top {
      width: 32px; height: 32px; border-radius: 50%; background: #151824;
      border: 1px solid #ff0055; color: #ff0055; font-size: 0.95rem; cursor: pointer;
      display: flex; justify-content: center; align-items: center; transition: all 0.2s ease;
      box-shadow: 0 0 6px rgba(255, 0, 85, 0.3);
    }
    .btn-power-off-top:hover { background: #ff0055; color: #fff; box-shadow: 0 0 10px #ff0055; }

    .btn-lock-top {
      width: 32px; height: 32px; border-radius: 50%; background: #151824;
      border: 1px solid #00ffcc; color: #00ffcc; font-size: 0.95rem; cursor: pointer;
      display: flex; justify-content: center; align-items: center; transition: all 0.2s ease;
      box-shadow: 0 0 6px rgba(0, 255, 204, 0.3);
    }
    .btn-lock-top:hover { background: #00ffcc; color: #08090e; box-shadow: 0 0 10px #00ffcc; }

    h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); font-size: clamp(0.9rem, 2vw, 1.2rem); text-transform: uppercase; }
    
    .top-bar-btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .btn-capture {
      background: #00ffcc; color: #0a0c13; border: none; padding: 6px 12px;
      border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4); transition: all 0.3s ease; display: none;
    }
    .btn-capture.active { background: #ff0055; color: #ffffff; box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
    
    .btn-fullscreen {
      background: #1e2436; color: #00ffcc; border: 1px solid #00ffcc; padding: 5px 10px;
      border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }
    .btn-fullscreen:hover { background: #00ffcc; color: #08090e; }

    /* Echo Control Group with Checkbox Box */
    .echo-control-group {
      display: flex; gap: 6px; align-items: center; background: #151824; padding: 4px 8px; border-radius: 6px; border: 1px solid #282d42;
    }
    .echo-label { font-size: 0.65rem; color: #ffcc00; font-weight: bold; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .echo-checkbox {
      width: 14px; height: 14px; accent-color: #ffcc00; cursor: pointer;
    }
    .echo-val-display { font-size: 0.65rem; color: #00ffcc; font-weight: bold; min-width: 30px; text-align: right; }
    
    input[type="range"].echo-slider {
      -webkit-appearance: none; width: 80px; height: 5px; border-radius: 3px;
      background: #0a0c13; border: 1px solid #282d42; outline: none;
    }
    input[type="range"].echo-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 14px; border-radius: 3px;
      background: #ffcc00; border: 1px solid #ffffff; cursor: pointer;
    }

    .switches-wrapper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .source-switch-box {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255, 204, 0, 0.08); border: 1px solid #ffcc00;
      padding: 4px 8px; border-radius: 20px;
    }
    .source-switch-box.stereo-box { background: rgba(0, 255, 204, 0.08); border-color: #00ffcc; }
    .source-switch-box label.title { font-size: 0.65rem; color: #ffcc00; font-weight: bold; }
    .source-switch-box.stereo-box label.title { color: #00ffcc; }
    
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444; transition: .3s; border-radius: 20px; border: 1px solid #888;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #00ffcc; border-color: #00ffcc; }
    input:checked + .slider:before { transform: translateX(18px); background-color: #0a0c13; }

    /* Visualizer Container */
    .visualizer-container {
      position: relative;
      width: 100%; height: 16vh; min-height: 90px;
      background: #000000; border-radius: 10px; overflow: hidden;
      flex-shrink: 0; padding: 2px; border: 1px solid #1a2233;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 255, 204, 0.1);
      transition: all 0.4s ease;
    }

    canvas { width: 100%; height: 100%; display: block; }

    /* Controls Elements Wrapper */
    .controls-wrapper {
      display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0;
    }

    .players-wrapper { display: flex; gap: 10px; width: 100%; flex: 1; min-height: 0; transition: all 0.4s ease; }
    .player-card {
      flex: 1; background: rgba(21, 24, 36, 0.8); backdrop-filter: blur(8px);
      padding: 8px 12px; border-radius: 10px; border: 1px solid #282d42;
      display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0;
      transition: all 0.3s ease;
    }
    .player-card.p1 h3 { color: #ff007f; font-size: clamp(0.85rem, 1.8vw, 1.1rem); display: flex; justify-content: space-between; }
    .player-card.p2 h3 { color: #00bfff; font-size: clamp(0.85rem, 1.8vw, 1.1rem); display: flex; justify-content: space-between; }
    
    .file-input-wrapper { position: relative; width: 100%; }
    
    input[type="file"] {
      display: block; width: 100%; color: #b0b9d0; font-size: 0.75rem;
      background: #0a0c13; padding: 6px; border-radius: 6px; border: 1px solid #282d42; cursor: pointer;
    }
    
    .folder-mode-input::-webkit-file-upload-button { visibility: hidden; width: 0; }
    .folder-mode-input::before {
      content: 'Choose Folder'; display: inline-block; background: #1e2436;
      border: 1px solid #00ffcc; border-radius: 4px; padding: 2px 6px;
      outline: none; white-space: nowrap; cursor: pointer; color: #00ffcc;
      font-weight: bold; font-size: 0.7rem; margin-right: 8px;
    }

    audio { width: 100%; height: 28px; }

    .btn-reset-deck {
      display: none; width: 100%; background: #00ffcc; color: #08090e;
      border: none; padding: 6px; border-radius: 6px; font-size: 0.75rem;
      font-weight: bold; cursor: pointer; text-align: center;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4); margin-bottom: 2px;
    }
    .btn-reset-deck:hover { background: #00e6b8; }

    /* Custom Folder Playlist UI */
    .folder-controls { display: none; align-items: stretch; justify-content: space-between; gap: 6px; }
    .folder-nav-btn {
      background: #1e2436; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 8px;
      border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; height: auto;
    }
    .folder-nav-btn:hover { background: #00ffcc; color: #08090e; }
    
    .folder-playlist-container {
      flex: 1; background: #0a0c13; border: 1px solid #282d42;
      border-radius: 4px; max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 2px;
      scroll-behavior: smooth;
    }
    .playlist-item {
      display: flex; align-items: center; justify-content: space-between; background: #131722;
      border: 1px solid #1a2233; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; color: #b0b9d0;
    }
    .playlist-item.active { background: rgba(0, 255, 204, 0.15); border-color: #00ffcc; color: #00ffcc; font-weight: bold; }
    .playlist-item.dragging { opacity: 0.4; border: 1px dashed #00ffcc; }
    .drag-handle { cursor: grab; margin-right: 6px; color: #00ffcc; font-size: 0.8rem; padding: 0 4px; }

    .crossfader-card {
      background: rgba(21, 24, 36, 0.85); padding: 6px 14px; border-radius: 10px;
      border: 1px solid #282d42; text-align: center; flex-shrink: 0; transition: all 0.4s ease;
    }
    .crossfader-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .crossfader-header h3 { font-size: clamp(0.8rem, 1.3vw, 0.95rem); color: #00ffcc; }
    .fader-labels { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.7rem; margin-bottom: 2px; }
    .fader-labels .p1-lbl { color: #ff007f; }
    .fader-labels .center-lbl { color: #8f9bb3; font-size: 0.65rem; }
    .fader-labels .p2-lbl { color: #00bfff; }

    input[type="range"].crossfader {
      -webkit-appearance: none; width: 100%; height: 8px; border-radius: 6px;
      background: linear-gradient(90deg, #ff007f 0%, #1a1e2e 50%, #00bfff 100%);
      border: 1px solid #282d42; outline: none;
    }
    input[type="range"].crossfader::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 20px; border-radius: 3px;
      background: #ffffff; border: 2px solid #00ffcc; cursor: pointer;
    }

    .eq-container {
      background: rgba(21, 24, 36, 0.85); padding: 8px 10px; border-radius: 10px;
      border: 1px solid #282d42; flex-shrink: 0; height: 38vh; display: flex; flex-direction: column; gap: 8px;
      transition: all 0.4s ease;
    }
    .eq-channel { flex: 1; display: flex; flex-direction: column; min-height: 0; transition: all 0.3s ease; }
    .eq-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
    .eq-header h2 { color: #00ffcc; font-size: clamp(0.7rem, 1.1vw, 0.8rem); text-transform: uppercase; }
    .eq-header h2.left-title { color: #ff007f; }
    .eq-header h2.right-title { color: #00bfff; }
    
    .drive-btn-group { display: flex; gap: 4px; align-items: center; position: relative; }
    .preset-wrapper { position: relative; width: 130px; height: 24px; }

    .preset-select {
      position: absolute; top: 0; left: 0; width: 100%; background: #0a0c13; color: #00ffcc;
      border: 1px solid #282d42; padding: 2px 4px; border-radius: 4px; font-size: 0.65rem;
      outline: none; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .preset-select:focus { border-color: #00ffcc; }
    .preset-select option { padding: 4px; background: #0a0c13; color: #00ffcc; }
    
    .btn-drive {
      background: #1e2436; color: #00ffcc; border: 1px solid #00ffcc; padding: 2px 6px;
      border-radius: 4px; font-size: 0.6rem; cursor: pointer; font-weight: bold; height: 24px;
    }
    .btn-drive:hover { background: #00ffcc; color: #08090e; }
    .btn-drive:disabled { opacity: 0.4; cursor: not-allowed; background: #1e2436; color: #8f9bb3; border-color: #282d42; }

    .eq-sliders { display: flex; gap: 2px; overflow-x: auto; flex: 1; align-items: center; }
    .slider-group { display: flex; flex-direction: column; align-items: center; min-width: 14px; height: 100%; justify-content: space-between; flex: 1; }
    .slider-group span { font-size: 0.45rem; color: #8f9bb3; }
    .slider-group input[type="range"] {
      -webkit-appearance: none; writing-mode: bt-lr; appearance: slider-vertical;
      width: 4px; height: 60%; background: #0e1017; border-radius: 2px; outline: none; border: 1px solid #282d42;
    }
    .slider-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 100%; height: 8px; border-radius: 2px; background: #00ffcc; border: 1px solid #ffffff;
    }

    /* Floating Large RGB Ring Light Unlock Button Container */
    #rgbLockContainer {
      display: none;
      position: fixed;
      top: 80%; left: 50%;
      transform: translate(-50%, -50%);
      width: 130px; height: 130px;
      justify-content: center; align-items: center;
      z-index: 500;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
    }

    .rgb-orbit-ring {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      pointer-events: none;
      animation: rgbRotate 2s linear infinite;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
    }

    .rgb-dot {
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      box-shadow: 0 0 15px currentColor;
    }
    .rgb-dot:nth-child(1) { top: -6px; left: 50%; transform: translateX(-50%); background: #ff0055; color: #ff0055; }
    .rgb-dot:nth-child(2) { bottom: -6px; left: 50%; transform: translateX(-50%); background: #00ffcc; color: #00ffcc; }
    .rgb-dot:nth-child(3) { left: -6px; top: 50%; transform: translateY(-50%); background: #ffcc00; color: #ffcc00; }
    .rgb-dot:nth-child(4) { right: -6px; top: 50%; transform: translateY(-50%); background: #00bfff; color: #00bfff; }

    @keyframes rgbRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-large-unlock {
      width: 90px; height: 90px; border-radius: 50%;
      background: #08090e; border: 2px solid #00ffcc;
      color: #00ffcc; font-size: 2.2rem; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
      z-index: 2; transition: all 0.3s ease;
    }
    .btn-large-unlock:hover {
      background: #00ffcc; color: #08090e; transform: scale(1.08);
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.9);
    }
    .unlock-hint-text {
      font-size: 0.75rem; color: #00ffcc; font-weight: bold; letter-spacing: 1px;
      text-transform: uppercase; text-shadow: 0 0 8px #00ffcc;
    }

    body.screen-locked .top-bar,
    body.screen-locked .controls-wrapper {
      display: none !important;
    }
    body.screen-locked .visualizer-container {
      height: 60vh !important;
      border-radius: 0 0 15px 15px;
      border: 1px solid #00ffcc;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
    }
    body.screen-locked #rgbLockContainer {
      display: flex;
    }

    @media (max-width: 600px) {
      .players-wrapper { flex-direction: column; }
      .eq-container { height: 42vh; }
      .switches-wrapper { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- Power Screen -->
  <div id="powerScreen">
    <button class="power-btn-main" onclick="powerOnSystem()"><i class="fa-solid fa-power-off"></i></button>
    <div class="power-text-hint">PRESS TO POWER ON</div>
  </div>

  <!-- Intro Animation Screen -->
  <div id="introAnimationScreen">
    <div class="animated-title" id="animatedTitle">Audio DJ Console</div>
    <div class="animated-subtitle" id="animatedSubtitle">Powered by Coding Master Suraj</div>
  </div>

  <!-- Lock Screen Overlay -->
  <div id="lockScreen">
    <div class="lock-box" id="lockBox">
      <h2>🔒 System Locked</h2>
      <input type="password" id="passInput" placeholder="Type password..." oninput="clearLockError()" onkeydown="if(event.key==='Enter') unlockSystem()">
      <button id="unlockBtn" onclick="unlockSystem()">UNLOCK</button>
      <div id="lockError"></div>
    </div>
  </div>

  <div class="app-container">
    <!-- Top Header Bar -->
    <div class="top-bar">
      <div class="brand-header-box">
        <button class="btn-power-off-top" title="Power Off System" onclick="powerOffSystem()"><i class="fa-solid fa-power-off"></i></button>
        <h1>Audio DJ Console</h1>
        <button class="btn-lock-top" title="Lock System Controls" onclick="lockConsoleUI()"><i class="fa-solid fa-lock"></i></button>
      </div>
      
      <div class="top-bar-btns">
        <button class="btn-capture" id="tabAudioBtn" onclick="toggleTabAudio()">🎵 Link Chrome Tab</button>
        <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        
        <!-- Echo Control Group with Checkbox Box -->
        <div class="echo-control-group">
          <label class="echo-label" for="echoCheckbox">
            <input type="checkbox" id="echoCheckbox" class="echo-checkbox" onchange="toggleEchoCheckbox(this)"> ECHO:
          </label>
          <input type="range" id="echoSlider" class="echo-slider" min="0" max="100" value="0" step="1" oninput="updateEchoFromSlider(this.value)">
          <span class="echo-val-display" id="echoValText">0%</span>
        </div>
      </div>

      <div class="switches-wrapper">
        <div class="source-switch-box">
          <label class="title">LINK CHROME TAB</label>
          <label class="title" id="tabAudioLabelBefore">OFF</label>
          <label class="switch">
            <input type="checkbox" id="tabAudioToggle">
            <span class="slider"></span>
          </label>

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwU_HHHI1YhI_NXRQ8q67-ZbgGrhJGJN3iqLUYjS35KOhWiUWqO5_VZLgYala9IYtPP/exec";

    function playPowerSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'on') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 2.5);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.3);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.9);

          osc.start(now);
          osc.stop(now + 3.0);
        } else if (type === 'off') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 2.5);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.9);

          osc.start(now);
          osc.stop(now + 3.0);
        }
      } catch (e) {
        console.error("Audio Sound Effect Error:", e);
      }
    }

    async function unlockSystem() {
      const passInput = document.getElementById('passInput');
      const unlockBtn = document.getElementById('unlockBtn');
      const errBox = document.getElementById('lockError');
      const lockBox = document.getElementById('lockBox');

      const enteredPass = passInput.value.trim();

      errBox.innerText = "Verifying...";

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=verify&password=${encodeURIComponent(enteredPass)}`);

    const frequencies = [
      20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250,

      4000, 5000, 6300, 8000, 10000, 12500, 16000, 18000, 20000

    let audioCtx, analyser;

    function toggleEchoCheckbox(checkbox) {
      const sliderVal = parseInt(document.getElementById('echoSlider').value);
      if (checkbox.checked) {
        updateEchoFromSlider(sliderVal > 0 ? sliderVal : 30);
        if (sliderVal === 0) document.getElementById('echoSlider').value = 30;

        updateEchoFromSlider(0);

    function updateEchoFromSlider(val) {
      const numVal = parseInt(val);
      document.getElementById('echoValText').innerText = numVal + '%';
      const checkbox = document.getElementById('echoCheckbox');

      if (numVal > 0 && !checkbox.checked) {
        checkbox.checked = true;
      } else if (numVal === 0) {
        checkbox.checked = false;
      }

      if (delayNode && echoGainNode && audioCtx) {
        delayNode.delayTime.setValueAtTime(0.25, audioCtx.currentTime);
        const gainIntensity = (numVal / 100) * 1.8;
        echoGainNode.gain.setValueAtTime(gainIntensity, audioCtx.currentTime);
      }
    }

        beforeLbl.style.display = 'none';

        tabAudioBtn.style.display = 'inline-block';

        afterLbl.style.display = 'none';
        tabAudioBtn.style.display = 'none';
        if (tabGainNode) tabGainNode.gain.value = 0;
      }
    });

    file1.addEventListener('change', function() {
      if (!fileAudioToggle.checked) {
        folderAudioFiles = Array.from(this.files).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac)$/i.test(f.name));
        
        if (folderAudioFiles.length > 0) {
          currentFolderIndex = 0; 
          renderFolderPlaylistUI();
          playSelectedTrack(0);

          file1.style.display = 'none';
          resetDeck1Btn.style.display = 'block';

          alert("No audio files found in selected folder!");
        }
      } else {
        if (this.files.length > 0) {
          audio1.src = URL.createObjectURL(this.files[0]);
          audio1.play();
          initAudioEngine();

          file1.style.display = 'none';
          resetDeck1Btn.style.display = 'block';
        }
      }
    });

    file2.addEventListener('change', function() {
      if (this.files.length > 0) {
        audio2.src = URL.createObjectURL(this.files[0]);

        initAudioEngine();

        file2.style.display = 'none';
        resetDeck2Btn.style.display = 'block';
      }
    });

    function resetDeck(deckNum) {
      if (deckNum === 1) {
        audio1.pause();
        audio1.removeAttribute('src');
        audio1.load();
        file1.value = "";
        file1.style.display = 'block';
        resetDeck1Btn.style.display = 'none';

        folderAudioFiles = [];
        currentFolderIndex = 0;
        folderPlaylistContainer.innerHTML = "";
      } else if (deckNum === 2) {
        audio2.pause();
        audio2.removeAttribute('src');
        audio2.load();
        file2.value = "";
        file2.style.display = 'block';
        resetDeck2Btn.style.display = 'none';
      }
      updateCrossfader();
    }

    function renderFolderPlaylistUI() {
      folderPlaylistContainer.innerHTML = "";

      folderAudioFiles.forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${idx === currentFolderIndex ? 'active' : ''}`;
        item.draggable = true;
        item.dataset.index = idx;

        item.innerHTML = `
          <span><span class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></span> ${idx + 1}.&nbsp;&nbsp;&nbsp;&nbsp;${file.name}</span>
          ${idx === currentFolderIndex ? '<i class="fa-solid fa-volume-high"></i>' : ''}
        `;

        item.addEventListener('click', (e) => {
          if (!e.target.classList.contains('drag-handle') && !e.target.closest('.drag-handle')) {
            playSelectedTrack(idx);
          }
        });

        item.addEventListener('dragstart', handleDragStart);
        item.addEventListener('dragover', handleDragOver);
        item.addEventListener('drop', handleDrop);
        item.addEventListener('dragend', handleDragEnd);

        folderPlaylistContainer.appendChild(item);
      });

      setTimeout(scrollToActiveTrack, 50);
    }

    function scrollToActiveTrack() {
      const activeItem = folderPlaylistContainer.querySelector('.playlist-item.active');
      if (activeItem) {
        folderPlaylistContainer.scrollTop = activeItem.offsetTop - folderPlaylistContainer.offsetTop;
      }
    }

    function handleDragStart(e) {
      dragSrcIndex = parseInt(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDrop(e) {
      if (e.stopPropagation) e.stopPropagation();
      const dropIndex = parseInt(this.dataset.index);

      if (dragSrcIndex !== null && dragSrcIndex !== dropIndex) {
        const movedItem = folderAudioFiles.splice(dragSrcIndex, 1)[0];
        folderAudioFiles.splice(dropIndex, 0, movedItem);

        if (dragSrcIndex === currentFolderIndex) {
          currentFolderIndex = dropIndex;
        } else if (dragSrcIndex < currentFolderIndex && dropIndex >= currentFolderIndex) {
          currentFolderIndex--;
        } else if (dragSrcIndex > currentFolderIndex && dropIndex <= currentFolderIndex) {
          currentFolderIndex++;
        }

        renderFolderPlaylistUI();
      }
      return false;
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    function playSelectedTrack(index) {
      index = parseInt(index);
      if (folderAudioFiles[index]) {
        currentFolderIndex = index; 
        renderFolderPlaylistUI();
        
        audio1.src = URL.createObjectURL(folderAudioFiles[currentFolderIndex]);
        audio1.play();
        initAudioEngine();
      }
    }

    function playNextTrack() {
      if (folderAudioFiles.length > 0) {
        currentFolderIndex++;
        if (currentFolderIndex >= folderAudioFiles.length) {
          currentFolderIndex = 0;
        }
        renderFolderPlaylistUI();
        
        audio1.src = URL.createObjectURL(folderAudioFiles[currentFolderIndex]);
        audio1.play();
      }
    }

    function playPrevTrack() {
      if (folderAudioFiles.length > 0) {
        currentFolderIndex--;
        if (currentFolderIndex < 0) {
          currentFolderIndex = folderAudioFiles.length - 1;
        }
        renderFolderPlaylistUI();
        
        audio1.src = URL.createObjectURL(folderAudioFiles[currentFolderIndex]);
        audio1.play();
      }
    }

    audio1.addEventListener('ended', function() {
      if (!fileAudioToggle.checked && folderAudioFiles.length > 0) {
        playNextTrack();
      }
    });

    function syncMonoEqualizer() {
      leftSliders.forEach((slider, index) => {
        const val = parseFloat(slider.value);
        if (rightSliders[index]) rightSliders[index].value = val;
        if (filtersLeft[index]) filtersLeft[index].gain.value = val;
        if (filtersRight[index]) filtersRight[index].gain.value = val;
      });
      
      const leftSelect = document.getElementById('presetListLeft');
      const rightSelect = document.getElementById('presetListRight');
      if (leftSelect && rightSelect) {
        rightSelect.value = leftSelect.value;
      }
      
      loadedRightValues = [...leftSliders.map(s => parseFloat(s.value))];
      checkSliderChanges('right');
    }

    function toggleTabAudio() {
      if (tabStream) {
        cancelTabAudio();
      } else {
        captureTabAudio();
      }
    }

    async function captureTabAudio() {
      try {
        const constraints = {
          video: true,
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        };

        tabStream = await navigator.mediaDevices.getDisplayMedia(constraints);
        const audioTrack = tabStream.getAudioTracks()[0];
        
        if (!audioTrack) {
          alert("Please select 'Share tab audio' to capture tab audio!");
          tabStream.getTracks().forEach(track => track.stop());
          tabStream = null;
          return;
        }

        initAudioEngine();
        tabSource = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        
        if (!tabGainNode) {
          tabGainNode = audioCtx.createGain();
        }
        
        tabGainNode.gain.value = 1;
        
        tabSource.connect(tabGainNode);
        tabGainNode.connect(mainMixGain);

        tabAudioBtn.innerText = "❌ Cancel Tab Audio";
        tabAudioBtn.classList.add('active');

        audioTrack.onended = () => {
          cancelTabAudio();
        };

      } catch (err) {
        console.error("Tab Capture Failed: ", err);
        cancelTabAudio();
      }
    }

    function cancelTabAudio() {
      if (tabStream) {
        tabStream.getTracks().forEach(track => track.stop());
        tabStream = null;
      }
      if (tabSource) {
        try { tabSource.disconnect(); } catch (e) {}
        tabSource = null;
      }

      tabAudioBtn.innerText = "🎵 Link Chrome Tab";
      tabAudioBtn.classList.remove('active');
    }

    function createFilterChain() {
      return frequencies.map((freq) => {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'peaking';
        filter.frequency.value = freq;
        filter.Q.value = 1.4;
        filter.gain.value = 0;
        return filter;
      });
    }

    function connectChain(chain) {
      for (let i = 0; i < chain.length - 1; i++) {
        chain[i].connect(chain[i + 1]);
      }
    }

    function initAudioEngine() {
      if (isAudioCtxInitialized) return;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      filesMasterGain = audioCtx.createGain();
      filesMasterGain.gain.value = 1.0;

      gainNode1 = audioCtx.createGain();
      gainNode2 = audioCtx.createGain();

      mainMixGain = audioCtx.createGain();
      mainMixGain.gain.value = 1.0;

      delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.25;
      
      echoGainNode = audioCtx.createGain();
      echoGainNode.gain.value = 0;

      const source1 = audioCtx.createMediaElementSource(audio1);
      const source2 = audioCtx.createMediaElementSource(audio2);

      source1.connect(gainNode1);
      source2.connect(gainNode2);

      gainNode1.connect(filesMasterGain);
      gainNode2.connect(filesMasterGain);

      filesMasterGain.connect(mainMixGain);

      const splitter = audioCtx.createChannelSplitter(2);
      const merger = audioCtx.createChannelMerger(2);

      filtersLeft = createFilterChain();
      filtersRight = createFilterChain();

      connectChain(filtersLeft);
      connectChain(filtersRight);

      mainMixGain.connect(splitter);

      splitter.connect(filtersLeft[0], 0);
      filtersLeft[filtersLeft.length - 1].connect(merger, 0, 0);

      splitter.connect(filtersRight[0], 1);
      filtersRight[filtersRight.length - 1].connect(merger, 0, 1);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;

      merger.connect(analyser);
      analyser.connect(audioCtx.destination);

      merger.connect(delayNode);
      delayNode.connect(echoGainNode);
      echoGainNode.connect(merger);

      isAudioCtxInitialized = true;

      leftSliders.forEach((s, idx) => {
        if (filtersLeft[idx]) filtersLeft[idx].gain.value = parseFloat(s.value);
      });
      rightSliders.forEach((s, idx) => {
        if (filtersRight[idx]) filtersRight[idx].gain.value = parseFloat(s.value);
      });

      updateCrossfader();
      renderVisualizer();
    }

    [audio1, audio2].forEach(audio => {
      audio.addEventListener('play', () => {
        initAudioEngine();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      });
    });

    function updateCrossfader() {
      const val = parseFloat(crossfader.value);
      const v1 = Math.cos((val / 100) * (Math.PI / 2));
      const v2 = Math.sin((val / 100) * (Math.PI / 2));

      if (gainNode1 && gainNode2) {
        gainNode1.gain.value = v1;
        gainNode2.gain.value = v2;
      }

      if (fileAudioToggle.checked) {
        volVal1.innerText = Math.round(v1 * 100) + '%';
      } else {
        volVal1.innerText = `Files: ${folderAudioFiles.length}`;
      }
      volVal2.innerText = Math.round(v2 * 100) + '%';

      if (val === 50) {
        crossfaderStatus.innerText = "Center (50/50)";
        crossfaderStatus.style.color = "#00ffcc";
      } else if (val < 50) {
        crossfaderStatus.innerText = fileAudioToggle.checked ? `Deck Audio File Player 1 (${Math.round(v1*100)}%)` : `Folder Audio Player (${Math.round(v1*100)}%)`;
        crossfaderStatus.style.color = "#ff007f";
      } else {
        crossfaderStatus.innerText = `Deck Audio File Player 2 (${Math.round(v2*100)}%)`;
        crossfaderStatus.style.color = "#00bfff";
      }
    }

    crossfader.addEventListener('input', updateCrossfader);

    function checkSliderChanges(channel) {
      const sliders = channel === 'left' ? leftSliders : rightSliders;
      const loadedValues = channel === 'left' ? loadedLeftValues : loadedRightValues;
      const saveBtn = document.getElementById(channel === 'left' ? 'saveBtnLeft' : 'saveBtnRight');

      let changed = false;
      if (loadedValues.length === 0) {
        changed = sliders.some(s => parseFloat(s.value) !== 0);
      } else {
        changed = sliders.some((s, idx) => parseFloat(s.value) !== loadedValues[idx]);
      }

      saveBtn.disabled = !changed;
    }

    function buildEqualizerUI(container, filtersArray, slidersArray, isLeft) {
      frequencies.forEach((freq, index) => {
        const group = document.createElement('div');
        group.className = 'slider-group';

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '-12'; slider.max = '12'; slider.value = '0'; slider.step = '0.5';

        let labelText = freq >= 1000 ? (freq / 1000) + 'k' : freq;
        const label = document.createElement('span');
        label.innerText = labelText;

        slider.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          if (filtersArray[index]) filtersArray[index].gain.value = val;

          if (!stereoToggle.checked) {
            if (isLeft && rightSliders[index]) {
              rightSliders[index].value = val;
              if (filtersRight[index]) filtersRight[index].gain.value = val;
            } else if (!isLeft && leftSliders[index]) {
              leftSliders[index].value = val;
              if (filtersLeft[index]) filtersLeft[index].gain.value = val;
            }
          }

          const channelKey = isLeft ? 'left' : 'right';
          const selectElem = document.getElementById(channelKey === 'left' ? 'presetListLeft' : 'presetListRight');
          if (selectElem && selectElem.value !== "") {
            selectElem.value = "";
          }

          checkSliderChanges(channelKey);
          if (!stereoToggle.checked) checkSliderChanges('right');
        });

        slidersArray.push(slider);
        group.appendChild(slider);
        group.appendChild(label);
        container.appendChild(group);
      });
    }

    buildEqualizerUI(eqContainerLeft, filtersLeft, leftSliders, true);
    buildEqualizerUI(eqContainerRight, filtersRight, rightSliders, false);

    async function fetchAllPresets(selectChannel = null, selectPresetName = null) {
      if (!currentPassword) return;

      const selectLeft = document.getElementById('presetListLeft');
      const selectRight = document.getElementById('presetListRight');

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=list&password=${encodeURIComponent(currentPassword)}`);
        const data = await res.json();

        selectLeft.innerHTML = '<option value="" disabled selected>-- Select Preset --</option>';
        selectRight.innerHTML = '<option value="" disabled selected>-- Select Preset --</option>';

        if (data.status === "success" && data.presets.length > 0) {
          let matchedFilename = null;

          data.presets.forEach(item => {
            const opt1 = document.createElement('option');
            opt1.value = item.filename;
            opt1.innerText = item.presetName;
            selectLeft.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = item.filename;
            opt2.innerText = item.presetName;
            selectRight.appendChild(opt2);

            if (selectPresetName && item.presetName.toLowerCase() === selectPresetName.toLowerCase()) {
              matchedFilename = item.filename;
            }
          });

          if (selectChannel && matchedFilename) {
            const targetSelect = selectChannel === 'left' ? selectLeft : selectRight;
            targetSelect.value = matchedFilename;
            loadSelectedPreset(selectChannel);
          }
        }
      } catch (err) {
        console.error("Error fetching presets:", err);
      }
    }

    async function savePresetToDrive(channel) {
      if (!currentPassword) return;

      const saveBtn = document.getElementById(channel === 'left' ? 'saveBtnLeft' : 'saveBtnRight');
      if (saveBtn.disabled) return;

      const presetName = prompt(`Enter name for Preset:`);
      if (!presetName || presetName.trim() === "") return;

      const cleanPresetName = presetName.trim();
      const sliders = channel === 'left' ? leftSliders : rightSliders;
      const values = sliders.map(s => parseFloat(s.value));

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            password: currentPassword,
            presetName: cleanPresetName,
            values: values
          })
        });

        alert(`Preset "${cleanPresetName}" saved!`);
        
        if (channel === 'left') {
          loadedLeftValues = [...values];
        } else {
          loadedRightValues = [...values];
        }
        checkSliderChanges(channel);

        setTimeout(() => fetchAllPresets(channel, cleanPresetName), 1000);
      } catch (err) {
        alert("Error saving preset: " + err);
      }
    }

    async function loadSelectedPreset(channel) {
      if (!currentPassword) return;

      const selectElem = document.getElementById(channel === 'left' ? 'presetListLeft' : 'presetListRight');
      const fileName = selectElem.value;
      if (!fileName) return;

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=get&fileName=${encodeURIComponent(fileName)}&password=${encodeURIComponent(currentPassword)}`);
        const data = await res.json();

        if (data.status === "success" && data.values) {
          const sliders = channel === 'left' ? leftSliders : rightSliders;
          const filters = channel === 'left' ? filtersLeft : filtersRight;

          data.values.forEach((val, i) => {
            if (sliders[i]) sliders[i].value = val;
            if (filters[i]) filters[i].gain.value = val;
          });

          if (channel === 'left') {
            loadedLeftValues = [...data.values];
          } else {
            loadedRightValues = [...data.values];
          }
          checkSliderChanges(channel);

          if (!stereoToggle.checked) {
            syncMonoEqualizer();
          }
        }
      } catch (err) {
        alert("Error loading preset: " + err);
      }
    }

    let peakCaps = [];

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      const totalHeight = canvas.height;
      const baselineY = totalHeight * 0.58;
      const numBars = 36;
      const barSpacing = 2;
      const barWidth = (canvas.width - (numBars * barSpacing)) / numBars;

      const maxBlocks = 14;
      const blockHeight = 2.5;
      const blockGap = 1.2;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const bufferLength = analyser ? analyser.frequencyBinCount : numBars;
      const dataArray = new Uint8Array(bufferLength);
      if (analyser) analyser.getByteFrequencyData(dataArray);

      if (peakCaps.length !== numBars) {
        peakCaps = new Array(numBars).fill(0);
      }

      ctx.beginPath();
      ctx.moveTo(0, baselineY);
      ctx.lineTo(canvas.width, baselineY);
      ctx.strokeStyle = '#00aaff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#00aaff';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;

      for (let i = 0; i < numBars; i++) {
        const dataIndex = Math.floor((i / numBars) * bufferLength);
        const audioVal = dataArray[dataIndex] || 0;
        
        const activeBlocks = Math.floor((audioVal / 255) * maxBlocks);

        if (activeBlocks >= peakCaps[i]) {
          peakCaps[i] = activeBlocks;
        } else {
          peakCaps[i] -= 0.15;
          if (peakCaps[i] < 0) peakCaps[i] = 0;
        }

        const x = i * (barWidth + barSpacing) + barSpacing / 2;
        const hue = (i / numBars) * 280 + 270;
        const blockColor = `hsl(${hue % 360}, 100%, 55%)`;

        for (let b = 0; b < maxBlocks; b++) {
          const y = baselineY - (b + 1) * (blockHeight + blockGap);

          if (b < activeBlocks) {
            ctx.fillStyle = blockColor;
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
          }
          ctx.fillRect(x, y, barWidth, blockHeight);
        }

        const peakBlockIndex = Math.floor(peakCaps[i]);
        if (peakBlockIndex > 0) {
          const peakY = baselineY - (peakBlockIndex + 1) * (blockHeight + blockGap);
          ctx.fillStyle = blockColor;
          ctx.fillRect(x, peakY, barWidth, blockHeight);
        }

        for (let b = 0; b < activeBlocks; b++) {
          const yReflect = baselineY + b * (blockHeight + blockGap) + 3;
          const alpha = Math.max(0, 0.35 - (b / maxBlocks) * 0.32);
          
          ctx.fillStyle = `hsla(${hue % 360}, 100%, 55%, ${alpha})`;
          ctx.fillRect(x, yReflect, barWidth, blockHeight);
        }
      }
    }

    renderVisualizer();

    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    document.addEventListener('selectstart', function (e) {
      e.preventDefault();
    });

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey && ['c', 'a', 'u', 's', 'C', 'A', 'U', 'S'].includes(e.key)) {
        e.preventDefault();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'F12') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c', 'I', 'J', 'C'].includes(e.key)) {
        e.preventDefault();
      }
    });
  </script>
